bacon: "0.1"
name: basic
description: Basic parameter semantics
params:
  volume:
    type: float
    range: [0, 1]
    default: 0.8
    unit: linear
  pan:
    type: float
    range: [-1, 1]
    default: 0
constants:
  PI: 3.14159265359
  TWO_PI: 6.28318530718
functions:
  dbToLinear:
    params: [db]
    expr: "10.0 ** (db / 20.0)"
  linearToDb:
    params: [lin]
    expr: "20.0 * log10(lin)"
realize:
  masterGain: volume
  panPosition:
    expr: "(pan + 1.0) / 2.0"
    unit: normalized
